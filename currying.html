<!DOCTYPE html>
<html lang="ru">
	<head>
	<meta charset="utf-8">
	<title>Currying</title>
	</head>
	<body>
		<h1>Currying</h1>

		<script>	
			function sum(a,b){ 
				return a + b; 
			}
			
			function sum(a){
				return function (b){
					return a + b;
				};
			}
			
			console.log( sum(10)(5) ); //

		</script>
	</body>
</html>
